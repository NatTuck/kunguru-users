# nginx vhost for the kunguru-users admin app.
# Reference config: users.<base> -> http://127.0.0.1:3030 (see notes/deploy.md).
#
# Install (on the public gateway, as root):
#   install -m 0644 deploy/nginx-users.conf /etc/nginx/sites-available/kunguru-users
#   ln -s /etc/nginx/sites-available/kunguru-users /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d users.ironbeard.com     # adds the :443 ssl server block

server {
    listen 80;
    listen [::]:80;
    server_name users.ironbeard.com;

    # The app owns auth/sessions; the proxy just forwards.
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
}
