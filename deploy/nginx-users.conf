# nginx vhost for the kunguru-users admin app — TEMPLATE.
#
# Fill in the placeholders before installing. The file deliberately uses
# placeholders nginx rejects, so copying it verbatim FAILS `nginx -t` (it must
# never be deployed with another instance's hostname baked in):
#   <base>   public DNS base (e.g. kunguru.net)
#   <port>   the app's PORT (config: runtime.port; default 3030)
#
# Install (on the public gateway, as root):
#   sed -e 's/<base>/kunguru.net/g' -e 's/<port>/3030/g' \
#     deploy/nginx-users.conf > /etc/nginx/sites-available/kunguru-users
#   ln -s /etc/nginx/sites-available/kunguru-users /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d users.<base>            # adds the :443 ssl server block

server {
    listen 80;
    listen [::]:80;
    server_name users.<base>;

    # The app owns auth/sessions; the proxy just forwards.
    location / {
        proxy_pass http://127.0.0.1:<port>;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;   # inline provisioning (hermes install) can take minutes
        client_max_body_size 2m;
    }
}
