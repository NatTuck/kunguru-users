# Strip the kunguru session cookie before proxying to tenant apps. The gateway
# authenticates the request and injects Remote-User / Remote-Groups instead.
#
# Reference copy of the session-cookie stripping map. Both
# scripts/nginx/ensure-user-sites.sh and scripts/bootstrap/ensure-nginx.sh
# embed this text (they are piped over stdin by the app / bootstrap), so keep
# the three copies in sync.
#
# Two maps: the first removes the cookie and its separator anywhere in the
# header; the second drops a leading "; " when the cookie came first.
map $http_cookie $kunguru_cookie_1 {
    default $http_cookie;
    "~^(?<kunguru_pre>.*?)(?:;\s*)?kunguru_sid=[^;]*(?<kunguru_post>;.*)?$" "$kunguru_pre$kunguru_post";
}
map $kunguru_cookie_1 $kunguru_cookie {
    "~^;\s*(?<kunguru_rest>.*)$" $kunguru_rest;
    default $kunguru_cookie_1;
}
